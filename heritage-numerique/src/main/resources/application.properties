# =====================================================
# CONFIGURATION SPRING BOOT - HERITAGE NUMERIQUE
# =====================================================

# =====================================================
# Configuration du serveur (PORT DYNAMIQUE POUR RENDER)
# =====================================================
server.port=${PORT:8080}
server.servlet.context-path=/

# =====================================================
# Configuration de la base de données MySQL (VIA ENV)
# =====================================================
# [MODIF 1] Remplacement des identifiants locaux par des variables d'environnement
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =====================================================
# Configuration JPA/Hibernate
# =====================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# =====================================================
# Configuration des fichiers uploadés
# =====================================================
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# =====================================================
# Configuration JWT (VIA ENV)
# =====================================================
# [MODIF 2] La clé secrète devient une variable d'environnement
jwt.secret=${JWT_SECRET}
jwt.expiration=480000000
jwt.issuer=heritage-numerique

# =====================================================
# Initialisation SQL (DESACTIVEE pour MySQL cloud)
# =====================================================
# [MODIF 3] Passage de 'embedded' à 'never' pour éviter les erreurs sur Render
spring.sql.init.mode=never
# spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.encoding=UTF-8
spring.sql.init.continue-on-error=true

# =====================================================
# Configuration des logs
# =====================================================
logging.level.root=INFO
logging.level.com.heritage=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# =====================================================
# Configuration Swagger/OpenAPI 3
# =====================================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.display-operation-id=true
springdoc.swagger-ui.default-models-expand-depth=3
springdoc.swagger-ui.default-model-expand-depth=3
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.show-extensions=true
springdoc.swagger-ui.show-common-extensions=true
springdoc.swagger-ui.enable-deep-linking=true
springdoc.swagger-ui.enable-validator=true
springdoc.swagger-ui.enable-filter=true
springdoc.swagger-ui.show-request-headers=true
springdoc.swagger-ui.show-response-headers=true
springdoc.swagger-ui.supported-submit-methods=get,post,put,delete,patch
springdoc.swagger-ui.validator-url=
springdoc.swagger-ui.oauth.client-id=
springdoc.swagger-ui.oauth.realm=
springdoc.swagger-ui.oauth.app-name=Heritage Numerique API
springdoc.swagger-ui.oauth.scope-separator=,
springdoc.swagger-ui.oauth.use-basic-authentication-with-access-code-grant=false
springdoc.swagger-ui.oauth-use-pkce-with-authorization-code-grant=false

# =====================================================
# Configuration Email (VIA ENV)
# =====================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
# [MODIF 4] Nettoyage : suppression des valeurs par défaut en dur
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

# =====================================================
# Configuration des fichiers uploadés (CHEMIN LINUX)
# =====================================================
# [MODIF 5] Remplacement du chemin Windows absolu par un dossier relatif
file.upload-dir=./uploads

# Configuration de l'application
app.name=Heritage Numerique

# =====================================================
# Configuration du scheduling
# =====================================================
spring.task.scheduling.pool.size=2

# =====================================================
# Configuration de la validation
# =====================================================
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.default-property-inclusion=non_null

# =====================================================
# Clé API Djelia (VIA ENV)
# =====================================================
# [MODIF 6] La clé devient une variable d'environnement
djelia.api.key=${DJELIA_API_KEY}